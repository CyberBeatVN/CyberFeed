{% if articles %}
<div class="flex flex-col gap-3">
  {% for article in articles %}
    {% include "partials/article_card.html" %}
  {% endfor %}
</div>

{% if has_next %}
<div hx-get="/htmx/articles?page={{ next_page }}{% if q %}&q={{ q }}{% endif %}{% if platform %}&platform={{ platform }}{% endif %}{% if is_bookmarked %}&is_bookmarked=true{% endif %}{% if category %}&category={{ category }}{% endif %}{% if tag %}&tag={{ tag }}{% endif %}"
     hx-trigger="revealed, click"
     hx-swap="outerHTML"
     class="flex justify-center py-4 cursor-pointer">
  <button class="btn btn-outline btn-sm">Load more articles</button>
</div>
{% endif %}

{% else %}
<div class="text-center py-12 text-base-content/50">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
  </svg>
  <p class="text-lg font-medium">No articles found</p>
  <p class="text-sm mt-1">Try adjusting your filters or add some sources.</p>
</div>
{% endif %}
