<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <title>Login — CyberFeed</title>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center">
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold justify-center mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 5c7.18 0 13 5.82 13 13M6 11a7 7 0 017 7m-6 0a1 1 0 11-2 0 1 1 0 012 0z"/>
        </svg>
        CyberFeed
      </h2>

      {% if error %}
      <div class="alert alert-error text-sm">
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/login" class="flex flex-col gap-3">
        <div class="form-control">
          <label class="label"><span class="label-text">Username</span></label>
          <input type="text" name="username" class="input input-bordered w-full" placeholder="Username" required autofocus />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password" name="password" class="input input-bordered w-full" placeholder="Password" required />
        </div>
        <button type="submit" class="btn btn-primary w-full">Login</button>
      </form>

      {% if registration_open %}
      <div class="divider text-xs">OR</div>
      <a href="/register" class="btn btn-outline btn-sm w-full">Create account</a>
      {% endif %}
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
